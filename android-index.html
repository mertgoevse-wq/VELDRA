<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VELDRA</title>
    <meta name="theme-color" content="#08090d" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    </noscript>
    <script>
      // Apply theme + skin before React mounts to avoid FOUC
      (function () {
        try {
          var theme = localStorage.getItem('bolt_theme');
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
          var skin = localStorage.getItem('bolt_skin') || 'veldra';
          document.documentElement.setAttribute('data-skin', skin);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Inline splash: visible before React hydrates, removed by android-main.tsx -->
      <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#08090d;z-index:9999">
        <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
          <div style="width:44px;height:44px;border:3px solid #27272a;border-top-color:#a1a1aa;border-radius:50%;animation:sp .7s linear infinite"></div>
          <span style="font:500 14px/1 system-ui;color:#71717a;letter-spacing:.02em">VELDRA</span>
        </div>
      </div>
      <style>@keyframes sp{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/android-main.tsx"></script>
  </body>
</html>
